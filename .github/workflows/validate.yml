name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Gate (all checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Report environment
        run: bash scripts/doctor.sh

      # The list of checks lives in scripts/check.sh, not here. --strict makes
      # a check that could not run (missing tool) fail the build instead of
      # being quietly skipped.
      - name: Run the gate
        run: bash scripts/ahg.sh check --stage=ci --strict
